<svg width="100%" viewBox="0 0 270 170" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Credit default risk thumbnail</title>
  <desc>Two overlapping score distributions, clients who paid and clients who defaulted, with a cost-based cutoff line well left of the usual 0.5</desc>
  <rect width="260" height="160" x="5" y="5" fill="#2e3d3d"/>

  <!-- axis: probability of default from 0 (x=30) to 1 (x=240) -->
  <line x1="30" y1="130" x2="240" y2="130" stroke="#e8ddd0" stroke-width="1.2" opacity="0.6"/>

  <!-- clients who paid: most scores low -->
  <path d="M30,130 C40,128 44,38 54,38 C64,38 74,104 108,122 C140,130 200,130 240,130 Z"
        fill="#7a9e8a" opacity="0.75"/>
  <!-- clients who defaulted: scores spread higher -->
  <path d="M30,130 C60,129 80,120 100,104 C124,86 138,80 150,82 C170,86 200,116 240,128 L240,130 Z"
        fill="#d9a441" opacity="0.7"/>

  <!-- legend: each group's name in its own color, top right, clear of the curves -->
  <text x="235" y="45" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="600" fill="#9cc0ac">paid</text>
  <text x="235" y="60" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="600" fill="#d9a441">defaulted</text>

  <!-- the usual 0.5 cutoff, faint -->
  <line x1="135" y1="30" x2="135" y2="130" stroke="#e8ddd0" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="135" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e8ddd0" opacity="0.5">0.5</text>

  <!-- the cost-based cutoff, 0.17 -->
  <line x1="66" y1="30" x2="66" y2="130" stroke="#e8ddd0" stroke-width="2"/>
  <text x="66" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e8ddd0" font-weight="600">0.17</text>

  <text x="137" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e8ddd0" font-weight="600" opacity="0.85">risk ranking · cost-based cutoff</text>
</svg>
