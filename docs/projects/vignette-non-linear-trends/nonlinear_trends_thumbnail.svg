<svg width="100%" viewBox="0 0 270 170" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Non-linear and non-monotonic trend thumbnail</title>
  <desc>Scatter of monitoring results over time with a fitted non-monotonic smooth curve and a shaded confidence band, evoking a GAM or LOESS fit</desc>
  <rect width="260" height="160" x="5" y="5" fill="#2e3d3d"/>

  <!-- axes -->
  <line x1="30" y1="20" x2="30" y2="130" stroke="#e8ddd0" stroke-width="1.2" opacity="0.5"/>
  <line x1="30" y1="130" x2="245" y2="130" stroke="#e8ddd0" stroke-width="1.2" opacity="0.5"/>

  <!-- confidence band -->
  <polygon points="45,108 63,93 81,73 99,56 117,48 135,63 153,83 171,93 189,78 207,58 225,43
    225,67 207,82 189,102 171,117 153,107 135,87 117,72 99,80 81,97 63,117 45,132"
    fill="#7a9e8a" opacity="0.28"/>

  <!-- fitted non-monotonic smooth curve -->
  <polyline points="45,120 63,105 81,85 99,68 117,60 135,75 153,95 171,105 189,90 207,70 225,55"
    fill="none" stroke="#4a7c6f" stroke-width="2.2"/>

  <!-- scatter of observations -->
  <circle cx="45" cy="124" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="63" cy="100" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="81" cy="90" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="99" cy="62" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="117" cy="65" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="135" cy="70" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="153" cy="100" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="171" cy="110" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="189" cy="85" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="207" cy="75" r="3" fill="#b85c38" opacity="0.85"/>
  <circle cx="225" cy="50" r="3" fill="#b85c38" opacity="0.85"/>

  <text x="137" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e8ddd0" font-weight="600" opacity="0.85">year</text>
  <text x="16" y="30" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e8ddd0" font-weight="600" opacity="0.85" transform="rotate(-90 16 30)">result</text>
</svg>
