<svg width="100%" viewBox="0 0 270 170" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Product search RAG thumbnail</title>
  <desc>A search bar above a ranked list of result rows with score bars, evoking a product search app</desc>
  <rect width="260" height="160" x="5" y="5" fill="#2e3d3d"/>

  <!-- search bar -->
  <rect x="30" y="20" width="210" height="24" rx="12" fill="none" stroke="#e8ddd0" stroke-width="1.5" opacity="0.8"/>
  <circle cx="45" cy="32" r="5" fill="none" stroke="#e8ddd0" stroke-width="1.5"/>
  <line x1="49" y1="36" x2="53" y2="40" stroke="#e8ddd0" stroke-width="1.5"/>
  <rect x="62" y="30" width="90" height="4" rx="2" fill="#e8ddd0" opacity="0.5"/>

  <!-- ranked results: rank marker, text line, score bar -->
  <g opacity="0.9">
    <circle cx="38" cy="62" r="5" fill="#d9a441"/>
    <rect x="50" y="59" width="80" height="6" rx="3" fill="#e8ddd0" opacity="0.6"/>
    <rect x="140" y="58" width="100" height="8" rx="2" fill="#4a7c6f"/>

    <circle cx="38" cy="82" r="5" fill="#d9a441" opacity="0.85"/>
    <rect x="50" y="79" width="70" height="6" rx="3" fill="#e8ddd0" opacity="0.6"/>
    <rect x="140" y="78" width="82" height="8" rx="2" fill="#4a7c6f"/>

    <circle cx="38" cy="102" r="5" fill="#d9a441" opacity="0.7"/>
    <rect x="50" y="99" width="76" height="6" rx="3" fill="#e8ddd0" opacity="0.6"/>
    <rect x="140" y="98" width="64" height="8" rx="2" fill="#7a9e8a"/>

    <circle cx="38" cy="122" r="5" fill="#d9a441" opacity="0.55"/>
    <rect x="50" y="119" width="62" height="6" rx="3" fill="#e8ddd0" opacity="0.6"/>
    <rect x="140" y="118" width="46" height="8" rx="2" fill="#7a9e8a"/>
  </g>

  <text x="137" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e8ddd0" font-weight="600" opacity="0.85">BM25 · semantic · hybrid · RAG</text>
</svg>
